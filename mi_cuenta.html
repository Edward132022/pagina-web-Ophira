 <script>
document.addEventListener("DOMContentLoaded", () => {
  const contenedor = document.getElementById("contenidoCuenta");

  fetch("mi_cuenta.php")
    .then(response => response.json())
    .then(data => {
      if (data.loggedIn) {
        contenedor.innerHTML = `
          <h2>Bienvenido, ${data.nombre}</h2>
          <p>Accede a tu <a href="index.php">Menú Principal</a> o continúa navegando en nuestro sitio.</p>
          <form method="POST" action="logout.php">
            <button type="submit" style="margin-top: 15px;">Cerrar sesión</button>
          </form>
        `;
      } else {
        contenedor.innerHTML = `
          <h2>No ha iniciado sesión</h2>
          <p>Por favor <a href="login.html">inicie sesión aquí</a> para acceder a su cuenta.</p>
        `;
      }
    });
});
</script>
