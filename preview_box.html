        price: 'COP 28.000',
        discount: 'Antes: COP 35.000',
        specs: {

        }
      },
      'caja_misteriosa': {
        name: 'Caja misteriosa',
        image: 'imagenes/box.png',
        description: 'Caja misteriosa con 3 pulseras aleatorias',
        price: '30.000',
        specs: {
          'Ancho/diámetro': '22x1cm',
          'Material': 'Cuero/Tejido',
          'Condición': 'Nuevo'
        }
      }
    };

    let currentProduct = null;

    // Al cargar la página, obtenemos el producto según el parámetro "id"
    window.addEventListener('DOMContentLoaded', () => {
      const productId = getQueryParam('id');
      if (productId && products[productId]) {
        const product = products[productId];
        currentProduct = product; // Guardamos el producto actual para usarlo en "Agregar al carrito"
        document.querySelector('.producto-imagen img').src = product.image;
        document.querySelector('.producto-imagen img').alt = 'Imagen del producto ' + product.name;
        document.querySelector('.producto-detalles h2').textContent = product.name;
        document.querySelector('.producto-detalles .descripcion').textContent = product.description;
        document.querySelector('.producto-detalles .precio').textContent = product.price;
        
        // Actualizamos las especificaciones
        const specsContainer = document.querySelector('.producto-detalles .especificaciones');
        specsContainer.innerHTML = '<h3>Especificaciones:</h3>';
        for (let key in product.specs) {
          const p = document.createElement('p');
          p.innerHTML = `<strong>${key}:</strong> ${product.specs[key]}`;
          specsContainer.appendChild(p);
        }
      }
    });

    // Evento para agregar al carrito
    document.querySelector('.agregar-carrito').addEventListener('click', function(e) {
      e.preventDefault();
      if (!currentProduct) return;
      
      // Construimos el objeto que se almacenará en el carrito (podrías incluir cantidad, etc.)
      const productToAdd = {
        id: getQueryParam('id'),
        name: currentProduct.name,
        description: currentProduct.description,
        price: currentProduct.price,
        image: currentProduct.image
      };
      
      // Recuperamos el carrito del localStorage o inicializamos un array vacío
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(productToAdd);
      localStorage.setItem('cart', JSON.stringify(cart));
      
      alert("Producto agregado al carrito");
    });
  </script>
